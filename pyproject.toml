[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nondiagonal-pyept"
version = "0.2.0"
description = "Non-diagonal electron propagator Hamiltonians with a PySCF interface"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pyscf>=2.7"]
[project.optional-dependencies]
test = ["pytest>=8", "pyscf>=2.14"]
sector = ["pyscf>=2.14"]
[tool.setuptools.packages.find]
include = ["nondiagonal_ept*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/ernopoku/Nondiagonal-PyEPT"
Documentation = "https://github.com/ernopoku/Nondiagonal-PyEPT/wiki"
